name: Build VYBE Android APK (Cloud)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get VYBE source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9 in the cloud
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile VYBE debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug
      - name: Upload VYBE APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VYBE-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
